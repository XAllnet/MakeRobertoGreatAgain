name: Validate Roberto Zones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check numpy pillow vacuum-map-parser-base==0.1.5
      - name: Compile every Python file
        run: python -m compileall -q custom_components/roberto_zones
      - name: Run offline overlay tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
