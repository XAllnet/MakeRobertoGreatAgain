analyze_now:
  name: Karte jetzt untersuchen
  description: Liest die vorhandene Karte einmalig aus und berechnet unverbindliche Orientierungskandidaten. Sendet keine Roboterbefehle.
capture_reference:
  name: Aktuelle Karte als lokale Referenz speichern
  description: Speichert das aktuelle Kartenbild in /config/roberto_zones/reference.png. Nur bei vollständig erfasster Karte ausführen. Überschreibt die vorhandene Referenz.
import_reference:
  name: Historische Karte aus Datei importieren
  description: Lädt ein altes Xiaomi-Kartenbild über die Home-Assistant-Weboberfläche hoch. Das Bild wird nur lokal als Referenz gespeichert, nie an den Roboter gesendet. Vorhandene Referenz wird überschrieben.
  fields:
    image:
      name: Historische Wohnungskarte (PNG/JPG)
      description: Über das Feld ein vollständiges Karten-Screenshot hochladen (max. 10 MB). Kein ZIP.
      required: true
      selector:
        media:
          accept:
            - image/*
          image_upload: true
test_move_step:
  name: Testfahrt – ein kurzer Schritt ohne Saugen
  description: Nur unter Aufsicht auf völlig freier Fläche verwenden. Ein einzelner, langsamer Fernsteuerungsschritt; keine automatische Kartenfahrt, keine Reinigung.
  fields:
    direction:
      name: Richtung
      required: true
      selector:
        select:
          options:
            - label: Vorwärts
              value: forward
            - label: Rückwärts
              value: backward
            - label: Links lenken
              value: left
            - label: Rechts lenken
              value: right
    supervised:
      name: Roboter steht unter Aufsicht, Fläche ist frei
      description: Vor jeder einzelnen Bewegung bestätigen.
      required: true
      selector:
        boolean: {}
stop_test_drive:
  name: Testfahrt stoppen
  description: Versucht Roberto sofort zu stoppen und die Fernsteuerung zu beenden. Bei einem Verbindungsproblem die physische Stopptaste verwenden.

record_reference_point:
  name: Referenzpunkt vor einem Kartenreset speichern
  description: Nur nach vollständiger Kartenerfassung und capture_reference. Roberto über die vorhandene Live-Karte zum festen Ort fahren lassen, vollständig anhalten und zweimal mit neuem Positionsbericht bestätigen. Der Punkt bleibt privat in Home Assistant gespeichert.
  fields:
    name:
      name: Wiedererkennbarer Ortsname
      description: Zum Beispiel wohnzimmer_mitte; beim neuen Kartendurchlauf exakt denselben Punkt anfahren.
      required: true
      selector:
        text: {}
    physical_confirmation:
      name: Ich habe Roberto am richtigen Ort gesehen und er steht still
      required: true
      selector:
        boolean: {}
begin_verification:
  name: Koordinatenprüfung für neuen Kartendurchlauf beginnen
  description: Nur nach einem echten Kartenreset. Referenzpunkte und eindeutige Dock-Ausrichtung sind erforderlich. Sendet keinen Fahrbefehl.
  fields:
    new_map_confirmed:
      name: Ich bestätige, dass Roberto eine neue Karte erzeugt hat
      required: true
      selector:
        boolean: {}
verify_checkpoint:
  name: Referenzpunkt im neuen Kartendurchlauf prüfen
  description: Genau denselben realen Ort über die bisherige Live-Karte anfahren, anhalten, Ankunft vor Ort bestätigen und Aktion zweimal mit neuen Positionsmeldungen ausführen. Maximal 250 mm Abweichung.
  fields:
    name:
      name: Gespeicherter Referenzpunkt
      description: Exakter Name, zum Beispiel wohnzimmer_mitte
      required: true
      selector:
        text: {}
    physical_confirmation:
      name: Ich habe Roberto am richtigen Ort gesehen und er steht still
      required: true
      selector:
        boolean: {}
